let libraryQuery='',libraryFilter='all';
function filteredWords(){const q=libraryQuery.trim().toLocaleLowerCase();return words.filter(w=>(libraryFilter==='all'||wordStatus(w)===libraryFilter)&&(!q||w.en.toLocaleLowerCase().includes(q)||w.zh.includes(q)||w.group.includes(q)))}
function libraryResultsMarkup(){const visible=filteredWords(),names=groups.map(g=>g[0]).filter(g=>visible.some(w=>w.group===g));if(!visible.length)return `<div class="search-empty"><span class="empty-symbol" aria-hidden="true">⌕</span><h2>没有匹配的单词</h2><p>试试其他英文、中文或分类名称。</p><button class="secondary" onclick="clearLibrarySearch()">清除搜索与筛选</button></div>`;return `<div class="category-grid">${names.map((g,i)=>{const list=visible.filter(w=>w.group===g),total=words.filter(w=>w.group===g).length;return `<details class="category-card" ${(libraryQuery.trim()||libraryFilter!=='all'||i===0)?'open':''}><summary><span class="category-icon" aria-hidden="true">${String(groups.findIndex(x=>x[0]===g)+1).padStart(2,'0')}</span><span class="category-title">${g}<small>${list.length}${list.length!==total?' / '+total:''} 个词</small></span><span class="category-chevron" aria-hidden="true">⌄</span></summary><div class="category-words">${list.map(w=>`<div class="library-word"><div class="library-word-top"><b>${w.en}</b>${statusBadge(w)}</div><span class="library-translation">${w.zh}</span></div>`).join('')}</div><button class="category-practice" onclick="startGroup('${g}')">练习整组 ${total} 词 <span aria-hidden="true">→</span></button></details>`}).join('')}</div>`}
function updateLibraryResults(){const results=document.getElementById('library-results'),count=document.getElementById('library-result-count');if(results)results.innerHTML=libraryResultsMarkup();if(count)count.textContent=`找到 ${filteredWords().length} / ${words.length} 个词`;document.querySelectorAll('[data-filter]').forEach(b=>{const selected=b.dataset.filter===libraryFilter;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))})}
function setLibraryQuery(value){libraryQuery=value;updateLibraryResults()}
function setLibraryFilter(value){libraryFilter=['all','good','mid','bad','unrated'].includes(value)?value:'all';updateLibraryResults()}
function clearLibrarySearch(){libraryQuery='';libraryFilter='all';const field=document.getElementById('word-search');if(field)field.value='';updateLibraryResults()}

function overallPanel(){const p=overallProgress(),pct=p.total?Math.round(p.mastered/p.total*100):0;return `<section class="overall" aria-label="全部正式词库"><div class="overall-title"><h2>全部正式词库</h2><span class="muted">跨批去重 · 不含示例</span></div><div class="overview-metrics"><div class="metric"><span class="metric-label">总词数</span><div class="metric-number">${p.total}</div></div><div class="metric"><span class="metric-label">已掌握 / 总词数</span><div class="metric-number">${p.mastered}<small> / ${p.total}</small></div></div><div class="mastery-meter"><svg class="mastery-ring" aria-hidden="true" viewBox="0 0 60 60"><circle class="track" cx="30" cy="30" r="25"/><circle class="value" cx="30" cy="30" r="25" pathLength="100" stroke-dasharray="${pct} 100"/></svg><div><div class="mastery-percent">${pct}%</div><span class="metric-label">自评掌握率</span></div></div></div><details class="counting-note"><summary>统计口径</summary><p>“已掌握”表示最近自评为记住，不代表长期掌握。旧记录未记录评分时间，重复词暂采用较后批次的有效自评。</p></details></section>`}
function home(){const official=Object.values(batches).filter(b=>b.id!=='demo');app.innerHTML=`<div class="page-heading"><div><div class="eyebrow"><span class="section-dot"></span> 学习工作台 / 01</div><h1>今日学习</h1><p>${official.length} 批正式词表 · 每 10 词集中回顾</p></div>${batchChooser()}</div>${overallPanel()}<div class="dashboard"><section class="countdown"><span class="timer-arc" aria-hidden="true"></span><div class="countdown-top"><span class="eyebrow">本批学习倒计时</span><svg class="clock-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="11"/><path d="M16 11v7l5 3M12 3h8M16 3v4M24 8l3-3"/></svg></div><div><div id="countdown-time" class="clock" role="timer" aria-label="剩余时间">${clockText()}</div><div class="clock-labels">小时　 /　 分钟　 /　 秒</div></div><div class="row"><p id="countdown-status">${clockStatus()}</p><button class="primary" id="countdown-start" onclick="startCountdown()" ${deadline?'hidden':''}>开始 72 小时 ↗</button></div></section><section class="panel current-batch"><span class="badge">${batchStats(activeBatch).seen?'正在学习':'准备开始'}</span><h2>${activeBatch.name}</h2><p class="batch-caption">${words.length} 个词条 · ${batchId==='demo'?'原始词序':'照片纵向顺序'}</p><div class="batch-progress"><div class="row"><span class="muted">本批已掌握 / 总词数</span><strong>${count('good')} <span class="muted">/ ${words.length}</span></strong></div><div class="bar"><i style="width:${count('good')/words.length*100}%"></i></div></div><button class="primary batch-action" onclick="nav('study')"><span>${review?'继续本组回顾':batchStats(activeBatch).seen?'继续背词':'开始背词'}</span><span>→</span></button><div class="batch-meta">${batchStats(activeBatch).seen} 个已揭晓 · 第 ${round} 轮${review?' · 有一组清单待回顾':''}</div></section></div><div class="batch-heading"><h2>我的词表</h2><span class="muted">${official.length} 个批次</span></div><div class="collection-grid">${official.map((b,i)=>batchTile(b,i)).join('')}</div><button class="phone-entry" onclick="nav('device')"><span><strong>手机安装与学习备份</strong><small>离线背词 · 导出与导入学习进度</small></span><span aria-hidden="true">→</span></button><div class="local-note"><span aria-hidden="true">◦</span><span>学习记录保存在当前设备，请定期导出备份。</span></div>`}
function study(){if(review){reviewView();return}let w=queue[index];if(!w){app.innerHTML='<div class="empty"><h1>这一轮，没有待强化的词了。</h1><p>可以切换全部词，再打乱自测一次。</p><button class="primary" onclick="nav(\'settings\')">调整循环范围</button></div>';return}app.innerHTML=`<div class="study focus-study"><div class="focus-title"><div><span class="eyebrow">单词回忆 / 02</span><h1>专注背词</h1></div><span class="focus-batch">${activeBatch.name}</span></div><div class="row study-head"><button class="secondary" onclick="nav('home')">← 返回</button><span class="muted">第 ${round} 轮 · ${index+1} / ${queue.length}</span><button class="secondary" onclick="nav('settings')">设置</button></div><div class="bar"><i style="width:${(index+1)/queue.length*100}%"></i></div><div class="group-position"><span>第 ${Math.floor(index/10)+1} 组 · 本组 ${index%10+1} / ${Math.min(10,queue.length-Math.floor(index/10)*10)}</span><span class="step-dots" aria-hidden="true">${Array.from({length:Math.min(10,queue.length-Math.floor(index/10)*10)},(_,i)=>`<i class="${i<index%10?'passed':i===index%10?'now':''}"></i>`).join('')}</span></div><button class="card ${revealed?'revealed':''}" onclick="flip()"><span class="badge">${w.group}</span><span class="recall-direction">${settings.direction==='en'?'英文 → 中文':'中文 → 英文'}</span><div class="word">${settings.direction==='en'?w.en:w.zh.replace(/^\S+\. /,'')}</div>${revealed?`<div class="answer">${settings.direction==='en'?w.zh:w.en}</div><span class="muted">先判断自己是否想起，再选择下方按钮</span>`:'<div class="hint"><span aria-hidden="true">＋</span> 轻点卡片，显示答案</div>'}</button><div class="ratings"><button class="bad" ${!revealed?'disabled':''} onclick="rate('bad')">不会 ↻</button><button class="mid" ${!revealed?'disabled':''} onclick="rate('mid')">模糊 ≈</button><button class="good" ${!revealed?'disabled':''} onclick="rate('good')">记住 ✓</button></div><div class="controls"><button class="secondary" onclick="togglePlay()">${playing?'Ⅱ 暂停播放':'▷ 自动循环'}</button><button class="secondary" onclick="skip()">跳过 →</button></div>${revealed?`<section class="memory-panel" aria-label="记忆辅助"><div class="memory-block"><h3><span class="memory-number">01</span> 速记提示</h3><p>${tips[w.en]?.[1]||''}</p></div><div class="memory-block"><h3><span class="memory-number">02</span> 同类词对照</h3><div class="related-list">${words.filter(other=>other.group===w.group&&other.en!==w.en).map(other=>`<div><span class="related-word">${other.en}</span><span class="related-meaning">${other.zh.replace(/^\S+\. /,'')}</span></div>`).join('')||'<p>本批暂无其他同类词。</p>'}</div><small class="muted">同类词不一定可以互换，注意各自含义。</small></div></section>`:''}<p class="muted" style="text-align:center">${playing?'自动播放仅计浏览，不计作记住':'先在心里回答，再揭晓答案'} · 本轮持续循环</p></div>`}
function flip(){if(revealed)return;revealed=true;seen[queue[index].en]=true;save();study();if(playing)schedule()}function next(){const end=index+1;const completed=queue.slice(Math.floor(index/10)*10,end);const completedRound=round;revealed=false;index++;if(end%10===0||end===queue.length){review={words:completed.map(w=>w.en),round:completedRound,start:end-completed.length+1,end,total:queue.length};stop()}if(index>=queue.length){index=0;round++;buildQueue()}save();study()}
function reviewView(){const list=review.words.map(id=>words.find(w=>w.en===id)).filter(Boolean);app.innerHTML=`<section class="study"><div class="row study-head"><button class="secondary" onclick="nav('home')">← 返回</button><span class="muted">第 ${review.round} 轮 · ${review.start}–${review.end} / ${review.total}</span></div><div class="eyebrow">本组清单</div><h1>回顾这 ${list.length} 个单词</h1><p>按刚才的出现顺序列出，集中核对一遍。</p><div class="panel review-list"><div class="row muted"><span>英文</span><span>中文 · 最近自评</span></div>${list.map(w=>`<div class="wordrow review-${['good','mid','bad'].includes(ratings[w.en])?ratings[w.en]:'unrated'}"><b>${w.en}</b><div class="review-meaning"><span>${w.zh}</span><small class="rating-label">${{good:'记住',mid:'模糊',bad:'不会'}[ratings[w.en]]||'未自评'}</small></div></div>`).join('')}</div><button class="primary" style="width:100%;margin-top:20px" onclick="continueAfterReview()">${review.end===review.total?'回顾完成，进入下一轮':'回顾完成，继续下一组'} →</button><p class="muted">循环已暂停。清单浏览不会更改记忆评分。</p></section>`}
function continueAfterReview(){review=null;save();study()}
function rate(v){stop();ratings[queue[index].en]=v;ratingTimes[queue[index].en]=Date.now();next()}function skip(){stop();next()}function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(!playing||page!=='study')return;if(!revealed)flip();else{next();if(playing)schedule()}},1000*(revealed?settings.answer:settings.think))}function togglePlay(){if(playing)stop();else{playing=true;schedule()}study()}
function settingView(){app.innerHTML=`<div class="study settings"><div class="eyebrow">学习设置</div><h1>循环设置</h1><p>设置会应用到下一轮学习。</p><div class="panel"><label>回忆方向<select id="direction"><option value="en">英文 → 中文</option><option value="zh">中文 → 英文</option></select></label><label>循环范围<select id="scope"><option value="all">全部 ${words.length} 词</option><option value="weak">待强化（含未自测）</option>${groups.map(g=>`<option>${g[0]}</option>`).join('')}</select></label><label>出现顺序<select id="order"><option value="sequence">按词表原顺序</option><option value="random">随机打乱</option></select></label><label>思考时间（秒）<input id="think" type="number" min="1" max="60"></label><label>答案时间（秒）<input id="answer" type="number" min="1" max="60"></label></div><button class="primary" style="width:100%;margin-top:24px" onclick="applySettings()">保存，开始循环 →</button><p class="muted">也可以完全手动翻卡，按自己的节奏学习。</p><button class="phone-entry" onclick="nav('device')">手机与学习备份 <span aria-hidden="true">→</span></button></div>`;Object.keys(settings).forEach(k=>document.getElementById(k).value=settings[k])}function applySettings(){review=null;for(const k of Object.keys(settings)){let v=document.getElementById(k).value;settings[k]=['think','answer'].includes(k)?Math.max(1,Math.min(60,Number(v)||3)):v}index=0;round=1;buildQueue();save();nav('study')}
function library(){const st=batchStats(activeBatch);app.innerHTML=`<div class="page-heading"><div><div class="eyebrow"><span class="section-dot"></span> 分类与检索 / 03</div><h1>我的词库</h1><p>${words.length} 个词条 · ${groups.length} 个分类 · ${batchId==='demo'?'保留原始词序':'保留照片原词序'}</p></div>${batchChooser()}</div><section class="library-toolbar"><label class="search-field"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="word-search" type="search" aria-label="搜索本批英文、中文或分类" placeholder="搜索本批英文、中文或分类" autocomplete="off" oninput="setLibraryQuery(this.value)"></label><div class="filter-row" aria-label="按掌握情况筛选">${['all','good','mid','bad','unrated'].map(k=>`<button class="filter-pill ${k===libraryFilter?'selected':''}" data-filter="${k}" aria-pressed="${k===libraryFilter}" onclick="setLibraryFilter('${k}')"><i class="filter-dot dot-${k}" aria-hidden="true"></i>${k==='all'?'全部':statusNames[k]}<span>${k==='all'?words.length:st[k]}</span></button>`).join('')}</div></section><div class="result-heading"><span id="library-result-count" aria-live="polite">找到 ${filteredWords().length} / ${words.length} 个词</span>${batchId!=='demo'?`<a href="${batchId}-review.md" target="_blank" rel="noopener">原词表与校对 ↗</a>`:''}</div><div id="library-results">${libraryResultsMarkup()}</div><p class="page-footnote">分类用于对照学习，同组词不一定可以互换。</p>`;document.getElementById('word-search').value=libraryQuery}
function startGroup(g){review=null;settings.scope=g;index=0;round=1;buildQueue();save();nav('study')}
function topicProgressItem(g){const members=words.filter(w=>w.group===g),n=members.filter(w=>wordStatus(w)==='good').length;return `<button class="topic-progress" onclick="startGroup('${g}')"><div class="row"><span>${g}</span><span class="muted">${n} / ${members.length} <b aria-hidden="true">↗</b></span></div><div class="bar"><i style="width:${n/members.length*100}%"></i></div></button>`}
function progress(){const st=batchStats(activeBatch),pct=Math.round(st.good/st.total*100),official=Object.values(batches).filter(b=>b.id!=='demo');app.innerHTML=`<div class="page-heading"><div><div class="eyebrow"><span class="section-dot"></span> 记录与复习 / 04</div><h1>掌握进度</h1><p>自评结果与浏览记录分别统计</p></div>${batchChooser()}</div>${overallPanel()}<div class="progress-layout"><section class="panel progress-summary"><div class="row"><h2>${activeBatch.name}</h2><span class="badge">当前批次</span></div><div class="progress-ring-wrap"><svg class="progress-donut" viewBox="0 0 180 180" role="img" aria-label="本批自评掌握率 ${pct}%"><circle class="donut-track" cx="90" cy="90" r="74"/><circle class="donut-fill" cx="90" cy="90" r="74" pathLength="100" stroke-dasharray="${pct} 100"/></svg><div class="progress-ring-label"><strong>${pct}<small>%</small></strong><span>自评掌握率</span></div></div><div class="progress-fraction"><strong>${st.good}<small> / ${st.total}</small></strong><span>已掌握 / 本批总词数</span></div><div class="seen-row"><span>已揭晓</span><strong>${st.seen} / ${st.total}</strong></div></section><section class="panel progress-states"><div class="row"><h2>本批记忆分布</h2><span class="muted">${st.total} 词</span></div>${stackBar(st)}<div class="state-grid">${['good','mid','bad','unrated'].map(k=>`<div class="state-card state-card-${k}"><span><i class="filter-dot dot-${k}"></i>${statusNames[k]}</span><strong>${st[k]}<small>词</small></strong></div>`).join('')}</div><div class="practice-prompt"><div><b>待巩固 ${st.mid+st.bad} 词</b><p>另有 ${st.unrated} 词未自测，一并加入练习。</p></div><button class="primary" onclick="${st.good===st.total?"nav('settings')":'startWeak()'}">${st.good===st.total?'检查复习范围':'开始强化'} →</button></div></section></div><div class="insights-grid"><section class="panel"><div class="section-heading"><h2>分类掌握情况</h2><span class="muted">${groups.length} 类</span></div><div class="topic-progress-list">${groups.slice(0,8).map(([g])=>topicProgressItem(g)).join('')}${groups.length>8?`<details class="more-topics"><summary>展开其余 ${groups.length-8} 个分类 <span aria-hidden="true">＋</span></summary>${groups.slice(8).map(([g])=>topicProgressItem(g)).join('')}</details>`:''}</div></section><section class="panel batch-insight"><div class="section-heading"><h2>各批学习进度</h2><span class="muted">${official.length} 批</span></div>${official.map((b,i)=>{const x=batchStats(b);return `<div class="batch-breakdown"><div class="row"><span class="batch-breakdown-label"><b>${String(i+1).padStart(2,'0')}</b>${b.name}${b.id===batchId?'<i>当前</i>':''}</span><strong>${x.good}<small> / ${x.total}</small></strong></div>${stackBar(x)}</div>`}).join('')}<div class="stack-legend">${['good','mid','bad','unrated'].map(k=>`<span><i class="filter-dot dot-${k}"></i>${statusNames[k]}</span>`).join('')}</div><p class="page-footnote">各批次独立计数；全库总词数跨批去重。</p></section></div><p class="page-footnote">“已掌握”为最近一次自评记住，不代表已经长期记牢。</p>`}
function startWeak(){review=null;settings.scope='weak';index=0;buildQueue();save();nav('study')}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(page==='study')study()}});render();
</script><script src="backup.js"></script><script src="mobile.js"></script></body></html>
